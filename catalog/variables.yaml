# =============================================================================
# Gridded EIF — variable & dataset registry
# =============================================================================
# SINGLE SOURCE OF TRUTH. The pipeline, the docs generator, and the web UI all
# read this file. Adding a year, a dataset, or a geography level should mean
# editing THIS FILE ONLY — never a component or a pipeline module.
#
# If exposing new data requires a code change, that is a bug.
# =============================================================================

registry_version: 1.0.0

source:
  base_url: https://www2.census.gov/ces/gridded_eif/
  citation: >-
    Voorheis, J., Colmer, J., Houghton, K., Lyubich, E., Munro, M., Scalera, C.,
    and Withrow, J. (2025). "The Public-Use Gridded Environmental Impacts Frame."
  landing_page: https://www.census.gov/data/experimental-data-products/gridded-eif.html
  data_version: "5.0"          # Census's own version of the Gridded EIF
  experimental: true

grid:
  resolution_deg: 0.01
  crs: EPSG:4326               # per eif_grid_topology.rda, the only CRS shipped with the data
  centroid_offset: 0.005       # cell edges land on exact 0.01 multiples
  key_columns: [grid_lon, grid_lat]
  key_dtype: string            # deliberately string — float equality breaks joins
  coverage: [CONUS, AK, HI]    # NOT territories: no PR, VI, GU, AS, MP

# -----------------------------------------------------------------------------
# Measures — the two noise treatments. Present in every population dataset.
# -----------------------------------------------------------------------------
measures:
  n_noise:
    label: Raw (noise-injected) counts
    description: >-
      Direct output of the noise-infusion process. Unbiased, but can be negative
      (8.3% of grid-cell rows in 2022, min -8).
    recommended_when: aggregate population above 600,000
    non_negative: false
  n_noise_postprocessed:
    label: Post-processed counts
    description: >-
      Small noisy cells pooled by race within each 1-degree grid point and
      redistributed, residual negatives clamped to zero. Always non-negative.
    recommended_when: aggregate population below 600,000
    non_negative: true
    default: true

# Threshold that selects the default measure. From the user guide §7.3.1.
measure_selection_population_threshold: 600000

# -----------------------------------------------------------------------------
# Dimensions — shared category definitions
# -----------------------------------------------------------------------------
dimensions:

  race_ethnicity:
    label: Race and ethnicity
    note: Hispanic takes precedence; all other categories are non-Hispanic.
    values:
      - {code: White,          label: "White"}
      - {code: Black,          label: "Black"}
      - {code: Hispanic,       label: "Hispanic"}
      - {code: Asian,          label: "Asian"}
      - {code: AIAN,           label: "American Indian & Alaska Native (AIAN)"}
      - {code: "Other/Unknown", label: "Other or unknown", residual: true}

  age_group:
    label: Age group
    # The shipped Parquet carries the literal strings "Under 18", "19-65", and
    # "Over 65". Voorheis et al. (2026, REEP 20(2), p. 315) describe the same
    # three bins as "under 18, 18-64, and 65+", as does the CES working paper.
    #
    # The published wording is used for display because "19-65" is wrong on its
    # face — it drops 18-year-olds and counts 65 in two bins. The `code` stays
    # the exact string in the files, so every query, export, and code snippet
    # still joins correctly. Fixing the labels upstream is a question for the
    # data's authors.
    label_source: "Voorheis et al. (2026), Review of Environmental Economics and Policy 20(2), p. 315"
    values:
      - {code: "Under 18",    label: "Under 18"}
      - {code: "19-65",       label: "18–64"}
      - {code: "Over 65",     label: "65 and over"}
      - {code: "Missing Age", label: "Age not reported", residual: true}
    footnote: >-
      Age groups are labelled as described in Voorheis et al. (2026): under 18,
      18–64, and 65+. The underlying data files use the strings "Under 18",
      "19-65", and "Over 65" for these same three groups; the codes are shown
      alongside the labels wherever a query is exported.

  sex:
    label: Sex
    values:
      - {code: "M",              label: "Male"}
      - {code: "F",              label: "Female"}
      - {code: "Missing Gender", label: "Not reported", residual: true}

  income_decile:
    label: Household income decile
    dtype: int
    note: >-
      Equal-count national deciles of household AGI, recomputed each year.
      A decile count is a distributional profile, not an income measure.
    values:
      - {code: 0,  label: "Decile 0", residual: true}
      - {code: 1,  label: "1st (lowest)"}
      - {code: 2,  label: "2nd"}
      - {code: 3,  label: "3rd"}
      - {code: 4,  label: "4th"}
      - {code: 5,  label: "5th"}
      - {code: 6,  label: "6th"}
      - {code: 7,  label: "7th"}
      - {code: 8,  label: "8th"}
      - {code: 9,  label: "9th"}
      - {code: 10, label: "10th (highest)"}

# -----------------------------------------------------------------------------
# Datasets
# -----------------------------------------------------------------------------
datasets:

  ageracesex:
    label: Population by age, race, and sex
    enabled: true
    file_pattern: "gridded_eif_pop_ageracesex_{year}.parquet"
    preliminary_file_pattern: "gridded_eif_pop_ageracesex_{year}_realtime.parquet"
    # Starts at 2000. The 1999 file is anomalous — it captures only ~70% of the
    # population where every later year is 85-96%, and EIL does not use it.
    # Excluded rather than merely warned about: a warning invites someone to
    # click through, and the resulting series would be wrong.
    #
    # To re-admit it you must BOTH set `start: 1999` AND delete the
    # `excluded_years` entry below. The exclusion is enforced independently of
    # the range precisely so that widening the range cannot silently undo it.
    years: {start: 2000, end: 2024}
    excluded_years:
      1999: "Anomalous administrative-records completeness (~70% vs 85-96% for all later years)." 
    preliminary_years: [2025]
    dimensions: [race_ethnicity, age_group, sex]
    unit: people

  raceincome:
    label: Population by race and income decile
    enabled: true
    file_pattern: "gridded_eif_pop_raceincome_{year}.parquet"
    preliminary_file_pattern: "gridded_eif_pop_raceincome_{year}_realtime.parquet"
    years: {start: 2000, end: 2024}   # see ageracesex — 1999 excluded
    excluded_years:
      1999: "Anomalous administrative-records completeness (~70% vs 85-96% for all later years)." 
    preliminary_years: [2025]
    dimensions: [race_ethnicity, income_decile]
    unit: people
    # The two population datasets cannot be crossed on demographics — they are
    # separate tabulations joinable only on grid cell. The UI must make choosing
    # a dataset the FIRST step so an impossible query is unreachable.
    not_joinable_with: [ageracesex]

  # --- Deferred. Present so adding them later is a config change, not code. ---

  pollutants:
    label: Air pollution exposure
    enabled: false
    file_pattern: "gridded_eif_pollutants_{year}.parquet"
    years: {start: 1999, end: 2023}
    kind: continuous
    note: >-
      Source coverage is staggered — SEDAC ends 2016, CACES 2020, ACAG 2022.
      Each variable must declare its own year range.
      NOTE: the 1999 exclusion on the population datasets does NOT carry over
      here — this is satellite and land-use-model data from ACAG/CACES/SEDAC,
      not EIF administrative records. The 1999 pollutant file is markedly
      smaller than 2000-2016 (55 MB vs 104 MB), which needs its own review
      before this dataset is enabled.

  extreme_weather:
    label: Extreme weather exposure
    enabled: false
    file_pattern: "gridded_extreme_weather_{year}.parquet"
    kind: continuous

  homevalue:
    label: Housing units by home value
    enabled: false
    file_pattern: "gridded_eif_hu_age_homeval_{year}.parquet"
    years: {start: 2024, end: 2024}
    unit: households

# -----------------------------------------------------------------------------
# Geography levels
# -----------------------------------------------------------------------------
# Generic over TIGER/Line: adding a level is a block here plus a shapefile URL.
# Deliberately NO block group — a 0.01 degree cell is about the size of a median
# block group, so that level implies precision the noise cannot support.
# -----------------------------------------------------------------------------
geographies:

  nation:
    label: Nation
    phase: 1
    source: constant
    constant_id: US
    constant_name: United States
    approx_units: 1

  state:
    label: State
    phase: 1
    tiger_url: https://www2.census.gov/geo/tiger/TIGER2024/STATE/tl_2024_us_state.zip
    id_field: GEOID
    name_field: NAME
    approx_units: 51

  county:
    label: County
    phase: 1
    tiger_url: https://www2.census.gov/geo/tiger/TIGER2024/COUNTY/tl_2024_us_county.zip
    id_field: GEOID
    name_field: NAME
    approx_units: 3144
    state_prefixed: true

  cbsa:
    label: Metro / micropolitan area
    phase: 2
    tiger_url: https://www2.census.gov/geo/tiger/TIGER2024/CBSA/tl_2024_us_cbsa.zip
    id_field: GEOID
    name_field: NAME
    approx_units: 939
    # CBSAs cover only metropolitan and micropolitan areas — roughly 94% of
    # grid cells fall outside one. Those cells must be DROPPED, not snapped to
    # the nearest metro: a rural cell hundreds of kilometres from a metro does
    # not belong to it, and snapping would invent population there.
    complete_coverage: false
    caveat: >-
      Metro and micropolitan areas do not cover the entire country. Cells
      outside any CBSA are excluded, so CBSA totals do not sum to the national
      total.

  puma:
    label: PUMA
    phase: 2
    tiger_url_pattern: https://www2.census.gov/geo/tiger/TIGER2024/PUMA20/tl_2024_{state_fips}_puma20.zip
    per_state: true
    id_field: GEOID20
    name_field: NAMELSAD20
    approx_units: 2400
    state_prefixed: true

  # Vintage is in the id on purpose. ERS has published 1980, 1990, 2000, and
  # 2020 delineations, and they are NOT interchangeable — 2020 uses the Penn
  # State methodology adapted for contiguity, so results do not carry across
  # vintages. Naming it `czone2020` means adding `czone1990` later cannot
  # collide or silently change anyone's published numbers.
  czone2020:
    label: Commuting zone (2020)
    phase: 2
    source: crosswalk          # not TIGER — county-to-CZ mapping from USDA ERS
    built_from: county
    approx_units: 598
    crosswalk_url: https://www.ers.usda.gov/media/6968/2020-commuting-zones.csv
    crosswalk_key_field: FIPStxt      # county FIPS
    crosswalk_value_field: CZ2020     # commuting zone number
    crosswalk_name_field: CZName
    citation: >-
      USDA Economic Research Service, Commuting Zones and Labor Market Areas,
      2020 delineation (updated January 2026).
    note: >-
      Commuting zones are built from journey-to-work data and group whole
      counties, so they are derived by remapping the county crosswalk rather
      than by a separate spatial join.

  zcta:
    label: ZIP Code Tabulation Area
    phase: 3
    # ZCTAs approximate delivery routes and leave gaps over unpopulated land.
    # Populated cells almost always fall inside one, so a short snap is
    # reasonable, but coverage is not guaranteed complete.
    complete_coverage: false
    # NO MAP LAYER. Topology extraction over 33,791 polygons needs tens of GB:
    # topojson builds a dense array sized by its longest arc, which for ZCTAs
    # comes to 97,081 arcs x 30,291 points = 43.8 GiB. It OOMs on a CI runner
    # and locally. Prequantization does not rescue it.
    #
    # Not worth engineering around for this layer: 33,791 polygons at national
    # zoom is visually unreadable, and it would have been a 5.6 MB download.
    # Table, time series, and downloads are unaffected — only the map tab is
    # hidden, which the catalog drives automatically by omitting the boundary.
    #
    # Proper vector tiles (tippecanoe, tiled by zoom) are the real fix and
    # would serve tract as well.
    map: false
    tiger_url: https://www2.census.gov/geo/tiger/TIGER2024/ZCTA520/tl_2024_us_zcta520.zip
    id_field: GEOID20
    name_field: GEOID20
    approx_units: 33000
    caveat: >-
      ZCTAs approximate postal delivery routes, not neighborhoods or any
      administrative unit. High demand, weak conceptual fit.

  tract:
    label: Census tract
    phase: 3
    # NOT BUILT. Measured, then withdrawn — the grid cannot support this level.
    #
    # Of 84,415 tract polygons, only 77,422 receive any grid cell; 6,993 (8.3%)
    # get none. The empty tracts have a median land area of 0.439 km2 against a
    # ~1.1 km2 grid cell, so no cell centroid falls inside them.
    #
    # The failure is systematically urban, which is where this research
    # concentrates: 75.5% of New York County tracts come back empty, 58.2% of
    # San Francisco, 43.2% of DC, 39.0% of Philadelphia, 29.1% of Cook County.
    # Of the tracts that do get data, 14.4% rest on a single cell and 37.3% on
    # three or fewer, so the privacy noise stops averaging out.
    #
    # Aggregation stays lossless — the national total is exact — but people are
    # attributed to whichever tract holds their cell centroid, so dense tracts
    # smaller than a cell lose their population to a neighbour. No caveat makes
    # an absent tract acceptable, and a map with holes over Manhattan invites
    # exactly the misreading this site exists to prevent.
    #
    # Anyone who needs tract can build it from the published crosswalk, where
    # their own cells-per-tract counts are visible.
    enabled: false
    # Recorded as data, not a comment, so it cannot drift out of the file
    # unnoticed and so a test can hold the decision in place.
    disabled_reason: >-
      Measured and withdrawn. Of 84,415 tract polygons only 77,422 receive any
      grid cell; 6,993 (8.3%) receive none. Empty tracts have a median land area
      of 0.439 km2 against a ~1.1 km2 grid cell, so no cell centroid falls
      inside them. The failure is systematically urban - 75.5% of New York
      County tracts come back empty, 58.2% of San Francisco, 43.2% of DC, 39.0%
      of Philadelphia, 29.1% of Cook County. Of tracts that do receive data,
      14.4% rest on a single cell and 37.3% on three or fewer, so privacy noise
      stops averaging out. Aggregation remains lossless nationally, but dense
      tracts smaller than a cell lose their population to a neighbour. Rebuild
      from the published crosswalk if you need it, with cells-per-tract visible.
    tiger_url_pattern: https://www2.census.gov/geo/tiger/TIGER2024/TRACT/tl_2024_{state_fips}_tract.zip
    # Verified: TIGER2024 publishes TRACT, PUMA20, and CD per state; CBSA and
    # ZCTA520 are single national files.
    per_state: true
    id_field: GEOID
    name_field: NAMELSAD
    approx_units: 85000
    state_prefixed: true
    # NO MAP LAYER, for the same reason as ZCTA: topology extraction over 85k
    # polygons needs far more memory than a CI runner has. ZCTA already OOMs at
    # 33k.
    map: false
    caveat: >-
      Tracts approach the size of a single grid cell. Measured at ZCTA (33k
      units) 1,143 units already rest on one cell; tracts are 2.6x finer, and
      dense urban tracts can be physically smaller than one 1.1 km2 cell, so
      centroid assignment either finds no cell or finds one whose residents
      mostly live elsewhere. Noise stops averaging out. Treat tract estimates as
      indicative, and prefer county or PUMA where either will serve.

  cd:
    label: Congressional district
    phase: 4
    tiger_url_pattern: https://www2.census.gov/geo/tiger/TIGER2024/CD/tl_2024_{state_fips}_cd119.zip
    per_state: true
    id_field: GEOID20
    name_field: NAMELSAD20
    approx_units: 435
    state_prefixed: true
    caveat: Districts are redrawn; the boundary vintage matters for comparisons.

# -----------------------------------------------------------------------------
# Aggregation rules — documented publicly at /docs
# -----------------------------------------------------------------------------
aggregation:
  method: point_in_polygon_centroid
  # The cell set a crosswalk is built from. MUST be the union across every
  # published dataset-year, never a single reference year.
  #
  # The grid is fixed; the POPULATED subset of it is not. Cells appear and
  # disappear as administrative-records coverage changes and as people move, so
  # no year is a superset of the others. Aggregation inner-joins each year
  # against the crosswalk, so a cell the crosswalk lacks is discarded silently
  # along with its population.
  #
  # This was previously a single reference year (2022) and cost every other
  # published year between 0.05% and 0.43% of its population — concentrated,
  # not diffuse: Hawaii was short 3.90% of its 2024 count. 2022 alone was exact,
  # which is why a test written against 2022 could never have caught it.
  # Validation checks C1, C6, and C7 hold this in place.
  #
  # Enabling the pollutant or extreme-weather datasets must extend the union to
  # cover them, or the published crosswalks will understate their coverage for
  # exactly the use the site recommends them for.
  crosswalk_cell_set: union_of_all_published_years
  # Snapping applies only to geographies that tile the country completely
  # (county, state, tract, PUMA, congressional district). For those, an
  # unmatched cell is a border artifact and must belong somewhere. For partial
  # geographies such as CBSA it is a genuine absence and is dropped instead.
  snap_unmatched_to_nearest: true
  snap_max_distance_m: 25000        # metres, measured in EPSG:5070 (not degrees)
  # Verified against the full union: 286 of 3,021,990 cells fall outside every
  # county polygon. They are a systematic border artifact concentrated in
  # Calexico, El Paso, and Laredo — cells straddling the US-Mexico border whose
  # centroid lands in Mexico, carrying 14,214 people in 2022. Dropping them
  # would undercount border communities.
  #
  # Exactly one cell in the union is beyond the snap radius and is therefore
  # excluded: -171.285, 55.955, open Bering Sea roughly 130 km from the
  # Pribilofs. It appears only in 2024 and 2025 and carries 17 people. Check C1
  # adjudicates this geometrically rather than against a list, so any OTHER
  # cell dropped from inside the country fails it.
  residual_categories_visible: true
  mix_measures: false          # never combine raw and post-processed in one table
