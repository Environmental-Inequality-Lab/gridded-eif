<!-- Resolves the one bare specifier in preact's vendored hooks build.
     Everything else is a relative path, so the site runs from any base path
     with no build step and no configuration. -->
<script type="importmap">
{
  "imports": {
    "preact": "./js/vendor/preact.module.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <noscript>
    <div style="padding:32px;max-width:60ch;margin:0 auto;font-family:system-ui,sans-serif">
      <h1>Explore Gridded EIF Data</h1>
      <p>This explorer runs queries in your browser and needs JavaScript.</p>
      <p>
        The underlying data is plain Parquet and does not:
        see the <a href="https://github.com/Environmental-Inequality-Lab/gridded-eif">source
        repository</a> for direct file URLs, or the
        <a href="https://www2.census.gov/ces/gridded_eif/">Census file directory</a>
        for the raw grid.
      </p>
    </div>
  </noscript>
</div>
<script type="module" src="js/app.js"></script>
</body>
