[project]
name = "gridded-eif-pipeline"
version = "0.1.0"
description = "Builds pre-aggregated Gridded EIF data products for the EIL explorer"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyyaml>=6.0",
  "boto3>=1.35",
  "typer>=0.12",
  "rich>=13.0",
  "requests>=2.32",
  "topojson>=1.9",     # topology-preserving simplification for map boundaries
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# The validation report. Kept out of the base install: the pipeline itself
# never plots or typesets, and CI jobs that only build data should not pull
# matplotlib.
validation = ["matplotlib>=3.9", "scipy>=1.14", "jinja2>=3.1"]

[project.scripts]
geif = "pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["pipeline*"]

# The LaTeX templates are data, not code, and are loaded by path at render
# time — without this they are missing from a non-editable install and the
# report fails only in the environment nobody tests in.
[tool.setuptools.package-data]
"pipeline.validation" = ["templates/*.tex", "templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
