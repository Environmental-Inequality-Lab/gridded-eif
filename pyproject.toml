[project]
name = "gridded-eif-pipeline"
version = "0.1.0"
description = "Builds pre-aggregated Gridded EIF data products for the EIL explorer"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyyaml>=6.0",
  "boto3>=1.35",
  "typer>=0.12",
  "rich>=13.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
geif = "pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
