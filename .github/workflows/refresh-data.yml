name: Refresh data

# The annual path. Runs on demand, or on a schedule that checks whether Census
# has published a new year. Publishing uses GitHub OIDC — no long-lived AWS keys
# are stored anywhere.

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year, range, or list — 2022 | 2000-2024 | 2018,2020-2022 | all"
        required: true
        type: string
      geography:
        description: "Comma-separated geography levels"
        required: false
        default: "county"
        type: string
      publish:
        description: "Upload to S3 after building"
        required: false
        default: true
        type: boolean
  schedule:
    # Census published the 2024 files in July. Check quarterly.
    - cron: "0 9 1 1,4,7,10 *"

permissions:
  id-token: write      # required for OIDC
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GEIF_BASE_URL: ${{ vars.GEIF_BASE_URL }}
      GEIF_BUCKET: ${{ vars.GEIF_BUCKET }}
      GEIF_DISTRIBUTION_ID: ${{ vars.GEIF_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # .cache holds TIGER shapefiles (~85 MB per level) and the built
      # crosswalks. The runner is ephemeral, so without this every run
      # re-downloads and re-joins.
      #
      # The key must not contain the raw geography input — it can be a
      # comma-separated list, and Actions rejects commas in cache keys.
      # Instead the key is content-addressed on the pipeline and registry, so
      # any change to crosswalk logic or geography definitions starts a fresh
      # cache rather than restoring stale crosswalks. run_id makes each save
      # unique, and restore-keys picks up the most recent compatible cache, so
      # levels accumulate across runs instead of overwriting each other.
      - name: Cache boundaries and crosswalks
        uses: actions/cache@v4
        with:
          path: .cache
          key: geif-cache-${{ hashFiles('pipeline/**', 'catalog/variables.yaml') }}-${{ github.run_id }}
          restore-keys: |
            geif-cache-${{ hashFiles('pipeline/**', 'catalog/variables.yaml') }}-

      # `geif build` validates each source file against the pinned contract
      # before aggregating it, and resolves the whole year plan up front so a
      # bad range fails immediately rather than mid-backfill.
      - name: Build
        run: |
          geif build \
            --geography "${{ inputs.geography }}" \
            --year "${{ inputs.year }}"

      # Multi-year query latency is dominated by per-file round trips, not
      # bytes — a 25-year national series reads 66 KB across 25 files and takes
      # ~5s in a browser. These all-years files collapse that to one request.
      # --base-url lets it pull years that were not rebuilt in this run straight
      # from the CDN, so a single-year refresh cannot produce a one-year
      # "all-years" file.
      # geo_id -> display name, so places are searchable by name rather than
      # by FIPS code. Year-independent, so built once per level.
      - name: Build name lookups
        run: geif names --geography "${{ inputs.geography }}"

      # The spatial join, published for reuse. Independent of the aggregates.
      - name: Publish crosswalks
        run: geif crosswalks --geography "${{ inputs.geography }}"

      # Simplified boundary geometry for the map. Values join at render time,
      # so this is independent of the data partitions.
      - name: Build map boundaries
        run: geif boundaries --geography "${{ inputs.geography }}"

      - name: Build all-years files
        run: |
          geif combine \
            --geography "${{ inputs.geography }}" \
            --base-url "$GEIF_BASE_URL"

      - name: Regenerate catalog
        run: geif catalog --base-url "$GEIF_BASE_URL"

      # Prints the identity this job presents to AWS. STS's denial message
      # never says WHICH condition failed, so without this an auth failure is
      # pure guesswork. The token itself is a credential and is never printed —
      # only the sub/aud claims, which are just repo and ref identifiers.
      - name: Show OIDC identity
        if: ${{ inputs.publish }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("sub       :", claims.get("sub"))
          print("aud       :", claims.get("aud"))
          print("repository:", claims.get("repository"))
          print("ref       :", claims.get("ref"))
          print()
          print("The role trust policy must match sub exactly (case-sensitive).")
          PY

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.publish }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # A Secret, not a Variable: it embeds the AWS account ID, and
          # workflow logs are public on a public repo. Secrets are masked.
          role-to-assume: ${{ secrets.GEIF_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish
        if: ${{ inputs.publish }}
        run: |
          geif publish \
            --bucket "$GEIF_BUCKET" \
            --distribution-id "$GEIF_DISTRIBUTION_ID"

      - name: Summary
        run: |
          {
            echo "### Data refresh — ${{ inputs.year }}"
            echo ''
            echo '```'
            python -c "
          import json, pathlib
          c = json.loads(pathlib.Path('.build/catalog.json').read_text())
          print('pipeline', c['pipeline_version'], '| registry', c['registry_version'])
          for e in c['entries']:
              flag = ' [preliminary]' if e['preliminary'] else ''
              print(f\"{e['dataset']:<12} {e['geography']:<8} {e['year']}  \"
                    f\"{e['rows']:>9,} rows  {e['bytes']/1e6:>6.1f} MB{flag}\")
          "
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
